services:
  - type: web
    name: frame-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      - key: TERMS_URL
        sync: false
      - key: PRIVACY_URL
        sync: false
      - key: SUPPORT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COMMUNITY_ENABLED
        value: 'false'
      - key: MODERATION_READY
        value: 'false'
      - key: TRUST_PROXY
        value: 'true'
